name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint components
        run: node scripts/validate.mjs
      - name: Catalog is up to date
        run: |
          node scripts/catalog.mjs
          git diff --exit-code docs/CATALOG.md plugins/*/README.md
      - name: Claude Code plugin validation
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          for plugin in plugins/*/; do claude plugin validate "$plugin"; done
      - name: Hook scripts
        run: bash scripts/test-hooks.sh
